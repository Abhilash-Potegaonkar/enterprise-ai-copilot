services:
  db:
    image: postgres:17-alpine
    container_name: enterprise-ai-copilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: enterprise_ai_copilot
      POSTGRES_USER: enterprise_ai_copilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres-data: